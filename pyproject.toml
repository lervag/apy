[project]
name = "apyanki"
version = "0.23.0"
description = "CLI script for interacting with local Anki collection"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Karl Yngve Lervåg", email = "karl.yngve@lervag.net" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "anki==26.9.2",
  "beautifulsoup4==4.15.0",
  "html5lib==1.1",
  "markdown==3.10.3",
  "markdownify==1.2.3",
  "readchar==4.2.2",
  "rich==15.0.0",
  "typer==0.27.2",
]

[project.urls]
"Bug Tracker" = "https://github.com/lervag/apy/issues"
Homepage = "https://github.com/lervag/apy"

[project.scripts]
apy = "apyanki.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pyrefly==1.3.1",
  "ruff==0.16.8",
  "types-beautifulsoup4==4.12.0.20250516",
  "types-markdown==3.10.2.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]

[tool.pyrefly.errors]
bad-dataclass-descriptor = true
deprecated = true
division-by-zero = true
empty-body = true
implicit-abstract-class = true
implicit-any-attribute = true
implicit-any-parameter = true
implicit-import = true
invalid-abstract-method = true
invalid-cast = true
missing-attribute-patch-target = true
missing-override-decorator = true
no-any-return-explicit = true
non-exhaustive-match = true
not-required-key-access = true
redundant-cast = true
redundant-condition = true
regex = true
string-as-iterable = true
unannotated-return = true
unimported-directive = true
unknown-attribute-type = true
unnecessary-comparison = true
unnecessary-type-conversion = true
unreachable = true
unsafe-overlap = true
unsupported-dynamic-base = true
untyped-class-decorator = true
untyped-function-decorator = true
unused-ignore = true
unused-type-ignore = true

[tool.pytest]
filterwarnings = ["ignore::DeprecationWarning:html5lib.*:"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = ["C416", "E", "TID252", "W"]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
add-bounds = "exact"
