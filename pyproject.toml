[project]
name = "apyanki"
version = "0.21.0"
description = "CLI script for interacting with local Anki collection"
authors = [{ name = "Karl Yngve Lervåg", email = "karl.yngve@lervag.net" }]
requires-python = ">=3.14"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = [
  "beautifulsoup4>=4.15",
  "click>=8.4",
  "markdown>=3.10",
  "readchar>=4.2",
  "markdownify>=1.2",
  "anki>=26.5",
  "html5lib>=1.1",
  "rich>=15.0",
]

[project.urls]
Homepage = "https://github.com/lervag/apy"
"Bug Tracker" = "https://github.com/lervag/apy/issues"

[project.scripts]
apy = "apyanki.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "mypy>=2.1",
  "types-beautifulsoup4>=4.12",
  "types-markdown>=3.10",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest]
filterwarnings = ["ignore::DeprecationWarning:html5lib.*:"]

[tool.mypy]
exclude = ["^tests/.*\\.py$"]
strict = true

[[tool.mypy.overrides]]
module = ["markdownify"]
ignore_missing_imports = true

[tool.basedpyright]
ignore = ["tests/*.py"]
reportImportCycles = false
reportExplicitAny = false
reportAny = false
reportImplicitStringConcatenation = false
